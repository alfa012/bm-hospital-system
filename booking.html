<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>অ্যাপয়েন্টমেন্ট বুকিং - BM Hospital</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --success: #16a34a;
      --bg: #f1f5f9;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Hind Siliguri', system-ui, sans-serif;
      background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 50%, #7c3aed 100%);
      min-height: 100vh;
      color: var(--text);
      padding: 20px;
    }
    .wrap { max-width: 560px; margin: 0 auto; }
    .header { text-align: center; color: white; margin-bottom: 24px; padding-top: 12px; }
    .header .logo { font-size: 48px; margin-bottom: 8px; }
    .header h1 { font-size: 1.6rem; font-weight: 700; }
    .header p { opacity: .9; font-size: .95rem; margin-top: 4px; }
    .card {
      background: white; border-radius: 16px; padding: 28px 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,.15);
    }
    .card h2 { font-size: 1.2rem; margin-bottom: 6px; }
    .card .sub { color: var(--muted); font-size: .9rem; margin-bottom: 22px; }
    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block; font-weight: 500; font-size: .9rem;
      margin-bottom: 5px; color: #334155;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 11px 14px; border: 1.5px solid var(--border);
      border-radius: 10px; font-family: inherit; font-size: 1rem; background: #f8fafc;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: none; border-color: var(--primary); background: white;
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 500px) { .form-row { grid-template-columns: 1fr; } }
    .doctor-card {
      border: 1.5px solid var(--border); border-radius: 10px; padding: 12px 14px;
      margin-bottom: 8px; cursor: pointer; transition: all .15s;
      display: flex; align-items: center; gap: 12px;
    }
    .doctor-card:hover { border-color: var(--primary); background: #eff6ff; }
    .doctor-card.selected {
      border-color: var(--primary); background: #eff6ff;
      box-shadow: 0 0 0 3px rgba(37,99,235,.15);
    }
    .doctor-card .avatar {
      width: 44px; height: 44px; background: #dbeafe; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; flex-shrink: 0;
    }
    .doctor-card .info { flex: 1; }
    .doctor-card .name { font-weight: 600; font-size: .95rem; }
    .doctor-card .meta { font-size: .8rem; color: var(--muted); }
    .doctor-card .fee { font-weight: 700; color: var(--primary); font-size: .9rem; white-space: nowrap; }
    .btn {
      width: 100%; padding: 13px; border: none; border-radius: 10px;
      font-family: inherit; font-size: 1.05rem; font-weight: 600; cursor: pointer; margin-top: 8px;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .success-box { display: none; text-align: center; padding: 30px 16px; }
    .success-box.show { display: block; }
    .success-box .icon { font-size: 56px; margin-bottom: 12px; }
    .success-box h2 { color: var(--success); margin-bottom: 8px; }
    .success-box p { color: var(--muted); margin-bottom: 6px; }
    .success-box .ref {
      background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px;
      padding: 12px; margin: 16px 0; font-weight: 600; color: #166534;
    }
    .footer-link { text-align: center; margin-top: 20px; }
    .footer-link a { color: white; text-decoration: none; font-size: .9rem; opacity: .85; }
    .footer-link a:hover { opacity: 1; text-decoration: underline; }
    .empty-doctors {
      text-align: center; padding: 24px; color: var(--muted);
      background: #f8fafc; border-radius: 10px; margin-bottom: 14px;
    }
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: #0f172a; color: white; padding: 12px 24px; border-radius: 8px;
      font-size: .95rem; z-index: 100; transition: transform .3s; white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.error { background: #dc2626; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="logo">🏥</div>
      <h1 id="hospitalTitle">BM Hospital</h1>
      <p>অনলাইন অ্যাপয়েন্টমেন্ট বুকিং</p>
    </div>
    <div class="card" id="bookingCard">
      <h2>অ্যাপয়েন্টমেন্ট নিন</h2>
      <p class="sub">নিচের ফর্ম পূরণ করে সাবমিট করুন। হাসপাতাল থেকে নিশ্চিতকরণের জন্য কল করা হবে।</p>
      <form id="bookingForm">
        <div class="form-group">
          <label>আপনার নাম *</label>
          <input type="text" id="bName" required placeholder="পূর্ণ নাম লিখুন">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>মোবাইল নম্বর *</label>
            <input type="tel" id="bPhone" required placeholder="01XXXXXXXXX" pattern="01[0-9]{9}">
          </div>
          <div class="form-group">
            <label>বয়স *</label>
            <input type="number" id="bAge" required min="1" max="120" placeholder="বয়স">
          </div>
        </div>
        <div class="form-group">
          <label>লিঙ্গ *</label>
          <select id="bGender" required>
            <option value="">নির্বাচন করুন</option>
            <option value="Male">পুরুষ</option>
            <option value="Female">মহিলা</option>
            <option value="Other">অন্যান্য</option>
          </select>
        </div>
        <div class="form-group">
          <label>ডাক্তার নির্বাচন করুন *</label>
          <div id="doctorList"></div>
          <input type="hidden" id="bDoctorId" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>তারিখ *</label>
            <input type="date" id="bDate" required>
          </div>
          <div class="form-group">
            <label>সময় *</label>
            <select id="bTime" required>
              <option value="">নির্বাচন</option>
              <option value="09:00">সকাল ৯:০০</option>
              <option value="09:30">সকাল ৯:৩০</option>
              <option value="10:00">সকাল ১০:০০</option>
              <option value="10:30">সকাল ১০:৩০</option>
              <option value="11:00">সকাল ১১:০০</option>
              <option value="11:30">সকাল ১১:৩০</option>
              <option value="12:00">দুপুর ১২:০০</option>
              <option value="16:00">বিকাল ৪:০০</option>
              <option value="16:30">বিকাল ৪:৩০</option>
              <option value="17:00">বিকাল ৫:০০</option>
              <option value="17:30">বিকাল ৫:৩০</option>
              <option value="18:00">সন্ধ্যা ৬:০০</option>
              <option value="18:30">সন্ধ্যা ৬:৩০</option>
              <option value="19:00">সন্ধ্যা ৭:০০</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>সমস্যার সংক্ষিপ্ত বিবরণ</label>
          <textarea id="bNotes" rows="2" placeholder="যেমন: জ্বর, মাথাব্যথা..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn">অ্যাপয়েন্টমেন্ট নিশ্চিত করুন</button>
      </form>
      <div class="success-box" id="successBox">
        <div class="icon">✅</div>
        <h2>বুকিং সফল!</h2>
        <p>আপনার অ্যাপয়েন্টমেন্ট রিকোয়েস্ট গ্রহণ করা হয়েছে।</p>
        <div class="ref" id="refCode"></div>
        <p>হাসপাতাল থেকে শীঘ্রই মোবাইলে যোগাযোগ করা হবে।</p>
        <button class="btn btn-primary" style="margin-top:16px" onclick="resetForm()">আরেকটি বুকিং</button>
      </div>
    </div>
    <div class="footer-link">
      <a href="index.html">← স্টাফ লগইন</a>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script>
    const DB = {
      get(key) {
        try { return JSON.parse(localStorage.getItem('bm_' + key)) || []; }
        catch { return []; }
      },
      set(key, data) { localStorage.setItem('bm_' + key, JSON.stringify(data)); },
      getObj(key) {
        try { return JSON.parse(localStorage.getItem('bm_' + key)) || {}; }
        catch { return {}; }
      },
      id() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
    };
    function ensureDoctors() {
      if (DB.get('doctors').length) return;
      DB.set('doctors', [
        { id: 'd1', name: 'ডা. আব্দুর রহিম', dept: 'Medicine', phone: '01711000001', fee: 600, degree: 'MBBS, FCPS', exp: 15, schedule: 'শনি-বৃহঃ ৯টা-২টা' },
        { id: 'd2', name: 'ডা. ফাতেমা খাতুন', dept: 'Gynecology', phone: '01711000002', fee: 700, degree: 'MBBS, MS', exp: 12, schedule: 'রবি-বৃহঃ ১০টা-৩টা' },
        { id: 'd3', name: 'ডা. করিম উদ্দিন', dept: 'Cardiology', phone: '01711000003', fee: 900, degree: 'MBBS, MD', exp: 18, schedule: 'শনি-মঙ্গল ৯টা-১টা' },
        { id: 'd4', name: 'ডা. সালমা বেগম', dept: 'Pediatrics', phone: '01711000004', fee: 500, degree: 'MBBS, DCH', exp: 10, schedule: 'প্রতিদিন ১০টা-২টা' },
        { id: 'd5', name: 'ডা. জামাল হোসেন', dept: 'Orthopedics', phone: '01711000005', fee: 800, degree: 'MBBS, MS (Ortho)', exp: 14, schedule: 'রবি-বৃহঃ ১১টা-৩টা' },
        { id: 'd6', name: 'ডা. নাসরিন আক্তার', dept: 'Dermatology', phone: '01711000006', fee: 550, degree: 'MBBS, DDV', exp: 8, schedule: 'শনি-বুধ ৪টা-৮টা' }
      ]);
    }
    function toast(msg, type) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show' + (type === 'error' ? ' error' : '');
      setTimeout(() => t.classList.remove('show'), 3000);
    }
    let selectedDoctor = null;
    function renderDoctors() {
      ensureDoctors();
      const doctors = DB.get('doctors');
      const list = document.getElementById('doctorList');
      if (!doctors.length) {
        list.innerHTML = '<div class="empty-doctors">এখন কোনো ডাক্তার নেই। হাসপাতালে যোগাযোগ করুন।</div>';
        return;
      }
      list.innerHTML = doctors.map(d => `
        <div class="doctor-card" data-id="${d.id}" onclick="selectDoctor('${d.id}')">
          <div class="avatar">👨‍⚕️</div>
          <div class="info">
            <div class="name">${d.name}</div>
            <div class="meta">${d.dept || ''} · ${d.degree || ''} · ${d.schedule || ''}</div>
          </div>
          <div class="fee">৳${d.fee || 0}</div>
        </div>
      `).join('');
    }
    function selectDoctor(id) {
      selectedDoctor = DB.get('doctors').find(d => d.id === id);
      document.getElementById('bDoctorId').value = id;
      document.querySelectorAll('.doctor-card').forEach(c => {
        c.classList.toggle('selected', c.dataset.id === id);
      });
    }
    const dateInput = document.getElementById('bDate');
    const today = new Date().toISOString().slice(0, 10);
    dateInput.min = today;
    dateInput.value = today;
    const settings = DB.getObj('settings');
    if (settings.hospitalName) {
      document.getElementById('hospitalTitle').textContent = settings.hospitalName;
    }
    renderDoctors();
    document.getElementById('bookingForm').addEventListener('submit', function(e) {
      e.preventDefault();
      if (!selectedDoctor) { toast('ডাক্তার নির্বাচন করুন', 'error'); return; }
      const name = document.getElementById('bName').value.trim();
      const phone = document.getElementById('bPhone').value.trim();
      const age = parseInt(document.getElementById('bAge').value);
      const gender = document.getElementById('bGender').value;
      const date = document.getElementById('bDate').value;
      const time = document.getElementById('bTime').value;
      const notes = document.getElementById('bNotes').value.trim();
      if (!/^01[0-9]{9}$/.test(phone)) {
        toast('সঠিক মোবাইল নম্বর দিন (01XXXXXXXXX)', 'error');
        return;
      }
      let patients = DB.get('patients');
      let patient = patients.find(p => p.phone === phone);
      if (!patient) {
        patient = {
          id: DB.id(), name, age, gender, phone,
          blood: '', address: '', emergency: '', history: '',
          createdAt: new Date().toISOString(), source: 'online'
        };
        patients.push(patient);
        DB.set('patients', patients);
      }
      const apptId = DB.id();
      const appointments = DB.get('appointments');
      appointments.push({
        id: apptId,
        patientId: patient.id,
        patientName: name,
        doctorId: selectedDoctor.id,
        doctorName: selectedDoctor.name,
        date, time,
        notes: notes || 'অনলাইন বুকিং',
        status: 'Pending',
        source: 'online',
        createdAt: new Date().toISOString()
      });
      DB.set('appointments', appointments);
      document.getElementById('bookingForm').style.display = 'none';
      document.getElementById('successBox').classList.add('show');
      document.getElementById('refCode').textContent =
        `রেফারেন্স: ${apptId.toUpperCase()} · ${selectedDoctor.name} · ${date} ${time}`;
    });
    function resetForm() {
      document.getElementById('bookingForm').reset();
      document.getElementById('bookingForm').style.display = 'block';
      document.getElementById('successBox').classList.remove('show');
      selectedDoctor = null;
      document.getElementById('bDoctorId').value = '';
      document.querySelectorAll('.doctor-card').forEach(c => c.classList.remove('selected'));
      dateInput.value = today;
      renderDoctors();
    }
  </script>
</body>
</html>
